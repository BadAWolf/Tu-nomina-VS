name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm test
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Resume los fallos en una anotación visible en el pull request.
            msg=$(grep -E "^not ok|^ *not ok|error:|expected|actual|AssertionError|message:|location:" test.log | head -120 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Pruebas fallidas::$msg"
          fi
          exit "$status"
      - name: Las huellas SRI y la CSP coinciden con los scripts
        run: node admin/build-ad-csp.cjs && git diff --exit-code -- '*.html'
